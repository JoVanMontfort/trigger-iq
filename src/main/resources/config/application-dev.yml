# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    damnosol.triggeriq.app: DEBUG

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: '{baseUrl}/login/oauth2/code/google'
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  #          github:
  #            client-id: YOUR_GITHUB_CLIENT_ID
  #            client-secret: YOUR_GITHUB_CLIENT_SECRET
  #            scope: read:user,user:email
  #            redirect-uri: '{baseUrl}/login/oauth2/code/github'
  #          facebook:
  #            client-id: YOUR_FACEBOOK_CLIENT_ID
  #            client-secret: YOUR_FACEBOOK_CLIENT_SECRET
  #            scope: public_profile,email
  #            redirect-uri: '{baseUrl}/login/oauth2/code/facebook'
  #          linkedin:
  #            client-id: YOUR_LINKEDIN_CLIENT_ID
  #            client-secret: YOUR_LINKEDIN_CLIENT_SECRET
  #            scope: r_liteprofile,r_emailaddress
  #            redirect-uri: '{baseUrl}/login/oauth2/code/linkedin'
  #        provider:
  #          linkedin:
  #            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
  #            token-uri: https://www.linkedin.com/oauth/v2/accessToken
  #            user-info-uri: https://api.linkedin.com/v2/me
  #            user-name-attribute: id
  jackson:
    serialization:
      indent-output: true
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/triggerIq
    username: triggerIq
    password: triggerIq
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    # Remove 'faker' if you do not want the sample data to be loaded automatically
    contexts: dev, faker
  mail:
    host: localhost
    port: 1025
    username:
    password:
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 9080
  # make sure requests the proxy uri instead of the server one
  forward-headers-strategy: native

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  cache: # Cache configuration
    redis: # Redis configuration
      expiration: 3600 # By default objects stay 1 hour (in seconds) in the cache
      server: redis://localhost:6379
      cluster: false
      # server: redis://localhost:6379,redis://localhost:16379,redis://localhost:26379
      # cluster: true
  # CORS is only enabled by default with the "dev" profile
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: 'http://localhost:8100,https://localhost:8100,http://localhost:9000,https://localhost:9000,http://localhost:4200,https://localhost:4200'
    # Enable CORS when running in GitHub Codespaces
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    content-security-policy: default-src 'self';
      script-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        base64-secret: YTYwOGFhNWNjMDE3NTVmZTdiMTJkYTU2MDc2MTM5NWNhNDZjZDk3ODJmZDNkMzI3NWEzNWUxZmYwZDFhYTMzNDc1ZjgxNDBjNGM5MjhlNTk0ZTdhYmFlODBjNmZhMGFhNDY1NjVkY2E2YWZjYTE0OTgxN2U4N2I0MjFiMjMxNzM=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: http://127.0.0.1:8080
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
