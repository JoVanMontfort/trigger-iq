<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-black via-space to-black px-4 py-20">
  <div class="w-full max-w-md p-8 bg-white/5 border border-white/10 backdrop-blur-md rounded-2xl text-center shadow-xl">
    <h2 class="text-3xl font-orbitron text-neonBlue mb-6">Sign In With</h2>

    <div class="space-y-4">
      <!-- Google -->
      <button
        class="w-full flex items-center gap-3 py-2 px-4 border border-white/20 rounded-lg hover:bg-white/10 transition-all"
        (click)="loginWith('google')"
      >
        <i class="fab fa-google text-xl text-red-500"></i>
        <span>Google</span>
      </button>

      <!-- Facebook -->
      <button
        class="w-full flex items-center gap-3 py-2 px-4 border border-white/20 rounded-lg hover:bg-white/10 transition-all"
        (click)="loginWith('facebook')"
      >
        <i class="fab fa-facebook-f text-xl text-blue-500"></i>
        <span>Facebook</span>
      </button>

      <!-- LinkedIn -->
      <button
        class="w-full flex items-center gap-3 py-2 px-4 border border-white/20 rounded-lg hover:bg-white/10 transition-all"
        (click)="loginWith('linkedin')"
      >
        <i class="fab fa-linkedin-in text-xl text-blue-700"></i>
        <span>LinkedIn</span>
      </button>

      <!-- GitHub -->
      <button
        class="w-full flex items-center gap-3 py-2 px-4 border border-white/20 rounded-lg hover:bg-white/10 transition-all"
        (click)="loginWith('github')"
      >
        <i class="fab fa-github text-xl text-white"></i>
        <span>GitHub</span>
      </button>
    </div>
  </div>
</section>
