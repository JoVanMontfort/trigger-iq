<!-- STEP 1: Small Upgrade Banner -->
<div
  *ngIf="showBanner"
  class="flex items-center justify-between p-3 bg-indigo-600 text-white cursor-pointer rounded-md shadow-md"
  (click)="openCard()"
>
  <span>Try TriggerIQ Pro – More insights and automation!</span>
  <span class="text-sm underline">Click to learn more</span>
</div>

<!-- STEP 2: Full Upgrade CTA Card -->
<div *ngIf="showCard" class="relative mt-4 p-6 bg-gradient-to-r from-purple-500 to-indigo-600 text-white rounded-xl shadow-lg">
  <button
    (click)="closeCard()"
    class="absolute top-2 right-2 text-white hover:text-gray-300 text-xl font-bold focus:outline-none"
    aria-label="Close"
  >
    &times;
  </button>

  <h2 class="text-2xl font-bold mb-2">Upgrade to TriggerIQ Pro</h2>
  <p class="mb-4">Unlock detailed analytics, automations, and AI-assisted triggers.</p>
  <a routerLink="/account/upgrade" class="inline-block px-4 py-2 text-sm font-semibold bg-white text-purple-700 rounded hover:bg-gray-100"
    >Upgrade Now</a
  >
</div>
