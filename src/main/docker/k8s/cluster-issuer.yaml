apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory # Production server
    email: jovm007me@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key # Secret to store private key
    solvers:
      - http01:
          ingress:
            class: nginx
