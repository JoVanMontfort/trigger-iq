apiVersion: v1
kind: Pod
metadata:
  name: pvc-busybox-test
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["/bin/sh"]
      args: ["-c", "while true; do echo 'Hello from EBS' >> /data/out.txt; sleep 5; done"]
      volumeMounts:
        - mountPath: /data
          name: test-volume
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: ebs-pvc-test
  restartPolicy: Never
