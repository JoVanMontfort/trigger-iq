apiVersion: apps/v1
kind: Deployment
metadata:
  name: triggeriq-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triggeriq-frontend
  template:
    metadata:
      labels:
        app: triggeriq-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/triggeriq-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: triggeriq-frontend-service
spec:
  selector:
    app: triggeriq-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
